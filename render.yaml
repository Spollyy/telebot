databases:
  - name: nihon-flight-db
    databaseName: nihon_flight_watch
    user: nihon_bot
    plan: free
    region: frankfurt

services:
  - type: web
    name: very-khitry-nihon-bot
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nihon-flight-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DUFFEL_ACCESS_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8

  - type: cron
    name: very-khitry-nihon-search
    runtime: python
    plan: starter
    region: frankfurt
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python search.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nihon-flight-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DUFFEL_ACCESS_TOKEN
        sync: false
      - key: SEARCH_CONCURRENCY
        value: "4"
